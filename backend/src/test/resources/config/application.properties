# Test-only overrides, loaded on top of src/main/resources/application.yml.
#
# The expired-holds sweep, the presence codes and the closing of overdue sessions run every minute in the application. In the tests
# they would run in the background of every cached context while a test moves the clock, and race
# the test for the same rows. Tests call them themselves when they mean to, so the schedules are
# pushed out of reach.
ayni.booking.hold-release-delay=PT24H
ayni.sessions.presence-check-delay=PT24H
ayni.sessions.closing-delay=PT24H
