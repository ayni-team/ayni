# Test-only overrides, loaded on top of src/main/resources/application.yml.
#
# The expired-holds sweep, the presence codes, the closing of overdue sessions and the reconciliation
# of pending purchases, and the abandoning of sessions whose tutor did not come, run every minute in the application. In the tests
# they would run in the background of every cached context while a test moves the clock, and race
# the test for the same rows. Tests call them themselves when they mean to, so the schedules are
# pushed out of reach.
ayni.booking.hold-release-delay=PT24H
ayni.sessions.presence-check-delay=PT24H
ayni.sessions.closing-delay=PT24H
ayni.payments.reconciliation-delay=PT24H
ayni.sessions.no-show-delay=PT24H
ayni.audit.analysis-delay=PT24H
ayni.wallet.integrity-check-delay=PT24H
ayni.events.resubmit-delay=PT24H

# TS04: delivering again at startup what the last run left incomplete. The test contexts of a module
# share its PostgreSQL, and a new context is not the same process starting again: it would deliver
# the leftovers of other test classes, against their mocks, in the middle of another test. The test
# about restarting (ReliableEventsAcceptanceTest) turns it on for the context it starts.
spring.modulith.events.republish-outstanding-events-on-restart=false

# TS01: Flyway migrates as the owner, the container's own user, while the application connects as
# ayni_app (see ApplicationRoleTestConnection), so row level security applies to every query the
# application makes in the tests too.
spring.flyway.user=test
spring.flyway.password=test

# Several test classes of a module share its PostgreSQL container, and each distinct application
# context keeps its own pool. Hikari's default keeps ten connections open per context, which runs
# the container out of connections once a module has eight or nine contexts. Pools that give their
# idle connections back keep every context under it, while a test that writes from many threads at
# once still gets the connections it needs.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000

# US08: a secret for the video passes of the tests. Only the tests use it; compose has its own.
ayni.sessions.video.jwt-secret=test-only-video-secret-of-at-least-32-characters
ayni.sessions.video.url=http://jitsi.test:8000
