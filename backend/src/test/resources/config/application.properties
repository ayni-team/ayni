# Test-only overrides, loaded on top of src/main/resources/application.yml.
#
# The expired-holds sweep runs every minute in the application. In the tests it would run in the
# background of every cached context while a test moves the clock, and race the test for the same
# rows. Tests call the sweep themselves when they mean to, so the schedule is pushed out of reach.
ayni.booking.hold-release-delay=PT24H
