spring:
  application:
    name: ayni-backend

  datasource:
    # Inside docker compose the host is "postgres"; running from an IDE it is
    # localhost. The default below covers the second case.
    url: ${AYNI_DB_URL:jdbc:postgresql://localhost:5432/ayni}
    username: ${AYNI_DB_USER:ayni}
    password: ${AYNI_DB_PASSWORD:ayni}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway creates the tables. Hibernate only checks that the entities match
      # what exists, and refuses to start when they do not.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # LocalTime and LocalDate reach the driver as they are, with no zone involved. Without
          # this a LocalTime goes through java.sql.Time and time_zone above shifts it by the JVM's
          # offset: 18:00 declared from a laptop in Lima was stored as 23:00. Instant is not
          # affected by this setting.
          java_time_use_direct_jdbc: true
        format_sql: true

  servlet:
    multipart:
      # The evidence a student attaches (US16): up to three files of five megabytes. Spring's own
      # default of one megabyte per file would refuse most portfolios before the rules are asked.
      max-file-size: 5MB
      max-request-size: 16MB

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Where notifications hands its emails. Mailpit under docker compose, which shows every email at
  # http://localhost:8025 instead of delivering it; from the IDE, the same Mailpit on localhost.
  mail:
    host: ${AYNI_MAIL_HOST:localhost}
    port: ${AYNI_MAIL_PORT:1025}
    username: ${AYNI_MAIL_USER:}
    password: ${AYNI_MAIL_PASSWORD:}
    properties:
      # An unreachable server fails the delivery in seconds, and the failure is recorded, instead of
      # holding the request that asked for the link.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${AYNI_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    pe.ayni: DEBUG


ayni:
  booking:
    # How many weeks ahead a tutor's hours exist, and when the nightly job moves that horizon.
    generation-weeks: 4
    generation-cron: "0 0 2 * * *"
    # How often expired holds (five minutes without confirming) go back to AVAILABLE. An expired
    # hold can already be taken over before this runs; the sweep makes it read as free again.
    hold-release-delay: PT1M
  sessions:
    # How often the presence codes that are due (five minutes into a session) are looked for.
    presence-check-delay: PT1M
    # How often the sessions left open fifteen minutes past their booked hour are closed.
    closing-delay: PT1M
  notifications:
    mail-from: ${AYNI_MAIL_FROM:Ayni <no-reply@ayni.local>}
  identity:
    # A link lives minutes and works once; the session it opens is what lasts.
    access-link-ttl: PT10M
    session-ttl: P7D
    access-link-base-url: http://localhost:5173/access/confirm
