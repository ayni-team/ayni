name: Security

# Every push to any branch, force pushes included, which is how the code of the incident arrived
# (docs/security.md). A branch with no pull request gets no other check. main, develop and pull
# requests run the same check inside the CI, before the rest of its jobs.
on:
  push:
    branches-ignore: [main, develop]

permissions:
  contents: read

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reads files and imports nothing of the repository. No install, no build.
      - name: Look for injected code
        run: node web/scripts/check-injected-code.mjs
