name: CI

# Web runs on every pull request, stacked ones included (their base is another feature branch,
# not develop or main), and again after a merge. Backend is the expensive job: it runs only when
# the backend, the deploy files or this workflow change. Payments service runs when its own
# folder, the backend (the other side of its contract), the deploy files or this workflow change. A red check is a pull request that does
# not get merged.
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # First of all, and before anything of the repository runs: a build loads its configuration files,
  # which is exactly where injected code hides (docs/security.md). It reads files and installs nothing.
  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Look for injected code
        run: node web/scripts/check-injected-code.mjs

  # A pull request is filtered by paths here, not in the trigger: a path filter on the trigger
  # would skip the Web job as well.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      payments: ${{ steps.filter.outputs.payments }}
    steps:
      - uses: actions/checkout@v4

      - name: Which parts changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "payments=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE" "$HEAD"
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          if grep -qE '^(backend/|deploy/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(payments-service/|backend/|deploy/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "payments=true" >> "$GITHUB_OUTPUT"
          else
            echo "payments=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend
    needs: [security, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles and runs the tests, ModularityTest among them: a module that
      # reaches into another module's internals fails here, before review.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

  # The payments service extracted from the monolith (ADR 0011): its own Maven project, its own tests
  # against a PostgreSQL of Testcontainers, and the image it is deployed as, built but not published.
  payments:
    name: Payments service
    needs: [security, changes]
    if: needs.changes.outputs.payments == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: payments-service/pom.xml

      - name: Build and test
        working-directory: payments-service
        run: ./mvnw -B verify

      # The Dockerfile of a deployment still builds; release.yml is what publishes it.
      - name: Build the image
        run: docker build -t ayni-payments:ci payments-service

  web:
    name: Web
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Exactly the versions of the lock file.
      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Prettier: one format for the whole web. `npm run format` fixes it.
      - name: Check format
        working-directory: web
        run: npm run format:check

      # ESLint: the rules of hooks, exhaustive effect dependencies and accessibility of the markup.
      - name: Lint
        working-directory: web
        run: npm run lint

      # Type checks (strict, against the types generated from docs/api/openapi.json) and builds.
      - name: Build
        working-directory: web
        run: npm run build

      # Vitest and Testing Library, with the server faked at the fetch level.
      - name: Test
        working-directory: web
        run: npm test
