name: CI

# Runs on every pull request towards the protected branches, and again after a
# merge. A red check is a pull request that does not get merged.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles and runs the tests, ModularityTest among them: a module that
      # reaches into another module's internals fails here, before review.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Exactly the versions of the lock file.
      - name: Install dependencies
        working-directory: web
        run: npm ci

      # ESLint: the rules of hooks, exhaustive effect dependencies and accessibility of the markup.
      - name: Lint
        working-directory: web
        run: npm run lint

      # Type checks (strict, against the types generated from docs/api/openapi.json) and builds.
      - name: Build
        working-directory: web
        run: npm run build

      # Vitest and Testing Library, with the server faked at the fetch level.
      - name: Test
        working-directory: web
        run: npm test
