name: CI

# Web runs on every pull request, stacked ones included (their base is another feature branch,
# not develop or main), and again after a merge. Backend is the expensive job: it runs only when
# the backend, the deploy files or this workflow change. A red check is a pull request that does
# not get merged.
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # A pull request is filtered by paths here, not in the trigger: a path filter on the trigger
  # would skip the Web job as well.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Which parts changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE" "$HEAD"
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(backend/|deploy/|\.github/workflows/ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles and runs the tests, ModularityTest among them: a module that
      # reaches into another module's internals fails here, before review.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Exactly the versions of the lock file.
      - name: Install dependencies
        working-directory: web
        run: npm ci

      # ESLint: the rules of hooks, exhaustive effect dependencies and accessibility of the markup.
      - name: Lint
        working-directory: web
        run: npm run lint

      # Type checks (strict, against the types generated from docs/api/openapi.json) and builds.
      - name: Build
        working-directory: web
        run: npm run build

      # Vitest and Testing Library, with the server faked at the fetch level.
      - name: Test
        working-directory: web
        run: npm test
