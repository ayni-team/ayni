name: Deploy

# Moves the production virtual machine to a release. Started by hand from the Actions tab, with the
# tag of a release whose image release.yml already published:
#
#   Actions > Deploy > Run workflow > tag: v1.2.0
#
# It signs in to the machine over SSH and runs deploy/update.sh there, which builds the web
# application, writes the tag into deploy/.env, pulls the images and restarts what changed.
#
# The connection data lives in the GitHub environment named production (Settings > Environments),
# never in the repository:
#
#   secret    DEPLOY_HOST         address of the virtual machine
#   secret    DEPLOY_USER         the user that owns the checkout and may run docker
#   secret    DEPLOY_SSH_KEY      private key of that user, OpenSSH format
#   secret    DEPLOY_KNOWN_HOSTS  optional: the line of the machine in known_hosts
#                                 (ssh-keyscan -t ed25519 <host>), checked when it is set
#   variable  DEPLOY_PATH         optional: the checkout on the machine, /opt/ayni by default
#
# Protect the environment with required reviewers if more than one person can run workflows.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy, for example v1.2.0'
        required: true
        type: string

permissions:
  contents: read

# Two deployments at once would fight over the same machine.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:

  deploy:
    name: Deploy ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The tag ends up inside a command run on the machine, so only a plain release tag passes.
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v1.2.0"
            exit 1
          fi

      - name: Update the machine
        env:
          TAG: ${{ inputs.tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ayni' }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_SSH_KEY" ]]; then
            echo "::error::DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY must be secrets of the production environment"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [[ -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set: trusting the key the machine shows now"
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi

          # The checkout on the machine must be at the version being deployed: deploy/ and the
          # web application come from it, the backend from the image of the same tag.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch --tags --force origin && git checkout --detach 'refs/tags/$TAG' && ./deploy/update.sh '$TAG'"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
