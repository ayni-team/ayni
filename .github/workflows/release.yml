name: Release

# Pushing a tag that starts with v (v1.0.0) builds the production image and publishes it to the
# GitHub Container Registry as ghcr.io/<owner>/ayni-backend:<tag>. Nothing is deployed from here:
# deploy.yml does that, on request, once the image exists.
#
# The tag is cut from a commit that already went through CI on main; this workflow does not run the
# tests again. It signs in with the GITHUB_TOKEN of the run and needs no secret of its own.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names are lower case, GitHub owners may not be.
      - name: Name the image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ayni-backend" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          # Links the package to this repository, so it shows up there and inherits its access.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
