# =============================================================================
# The whole project with one command:
#
#     docker compose up
#
# Postgres, the API, the payments service and the web application. Nobody
# needs Java, Maven, Node or Postgres installed: Docker provides all of it, and
# everyone runs the same versions.
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: ayni-postgres
    environment:
      POSTGRES_DB: ayni
      POSTGRES_USER: ayni
      POSTGRES_PASSWORD: ayni
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayni -d ayni"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the backend sends and shows it at http://localhost:8025 instead of
  # delivering it. The access link to sign in arrives here.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: ayni-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    container_name: ayni-backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      AYNI_DB_URL: jdbc:postgresql://postgres:5432/ayni
      # Two roles (TS01): Flyway migrates as the owner, ayni; the application connects as
      # ayni_app, which has no BYPASSRLS, so row level security applies to it. The first migration
      # that needs ayni_app creates it with this password. Development values only.
      AYNI_DB_USER: ayni
      AYNI_DB_PASSWORD: ayni
      AYNI_DB_APP_USER: ayni_app
      AYNI_DB_APP_PASSWORD: ayni_app
      # The secret the video passes are signed with, shared with Jitsi below (US08). Development
      # value only: a deployment sets its own, of at least 32 characters.
      AYNI_JITSI_JWT_SECRET: ${AYNI_JITSI_JWT_SECRET:-ayni-development-jitsi-secret-change-me}
      # Where the browsers open the call. To try it from a second computer on the local network,
      # http://<IP of this machine>:8000, together with JITSI_PUBLIC_URL and JITSI_ADVERTISE_IP
      # below (docs/demo.md, "Practice rooms").
      AYNI_JITSI_URL: ${AYNI_JITSI_URL:-http://localhost:8000}
      # The simulated academic system (ADR 0006): one <CODE>.json per university in the folder
      # mounted below, read each time a student is looked up. Adding a university's file needs no
      # restart.
      AYNI_ACADEMIC_DIRECTORY: /app/academic-directory
      # The evidence a student submits for a tool (US16), one folder per university, in a named
      # volume so it survives the container being replaced.
      AYNI_SKILLS_EVIDENCE_DIR: /var/lib/ayni/evidence
      # Who may call the API from a browser, and where the emailed access link points. The defaults
      # are this machine; a second computer on the local network needs its address in both
      # (docs/demo.md, "Practice rooms").
      AYNI_ALLOWED_ORIGINS: ${AYNI_ALLOWED_ORIGINS:-http://localhost:5173}
      AYNI_IDENTITY_ACCESS_LINK_BASE_URL: ${AYNI_IDENTITY_ACCESS_LINK_BASE_URL:-http://localhost:5173/access/confirm}
      AYNI_MAIL_HOST: mailpit
      AYNI_MAIL_PORT: 1025
      # An optional real relay for a short list of addresses, such as the lead's own mailbox
      # (docs/demo.md). Empty means everything goes to Mailpit; the list without the host, or the
      # host without the list, stops the backend from starting.
      AYNI_REAL_RELAY_ALLOWED_RECIPIENTS: ${AYNI_REAL_RELAY_ALLOWED_RECIPIENTS:-}
      AYNI_REAL_RELAY_HOST: ${AYNI_REAL_RELAY_HOST:-}
      AYNI_REAL_RELAY_PORT: ${AYNI_REAL_RELAY_PORT:-}
      AYNI_REAL_RELAY_USERNAME: ${AYNI_REAL_RELAY_USERNAME:-}
      AYNI_REAL_RELAY_PASSWORD: ${AYNI_REAL_RELAY_PASSWORD:-}
      AYNI_REAL_RELAY_STARTTLS: ${AYNI_REAL_RELAY_STARTTLS:-}
      AYNI_REAL_RELAY_SSL: ${AYNI_REAL_RELAY_SSL:-}
      # Credit purchases are the payments service's (ADR 0011): the backend forwards them to it by
      # its name on this network, and it calls back with the purchases it confirmed. Both carry the
      # same secret. Development value only.
      AYNI_PAYMENTS_SERVICE_URL: http://payments:8081
      AYNI_INTERNAL_TOKEN: ${AYNI_INTERNAL_TOKEN:-ayni-development-internal-token-change-me}
      # Development profile: modules whose data would otherwise come from a module
      # that does not exist yet fill a couple of examples at startup, so the
      # endpoints answer something in Swagger. Never set in a deployment.
      # SPRING_PROFILES_ACTIVE=demo docker compose up starts the presentation profile instead,
      # dev plus a clock the administrator moves (docs/demo.md).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "8080:8080"
    volumes:
      # The sources are mounted, so the container always runs what you have
      # edited. The Maven cache is a named volume so that a restart does not
      # download the internet again.
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      - ./backend/academic-directory:/app/academic-directory:ro
      - maven-cache:/root/.m2
      - skills-evidence:/var/lib/ayni/evidence

  # The database of the payments service, ayni_payments, on the same server (Database per Service,
  # ADR 0011). PostgreSQL creates POSTGRES_DB only on an empty volume, so this one-off container
  # creates the second database when it is missing, also on a volume that already has data, and
  # exits. Its roles are created by the service's own migrations.
  payments-db:
    image: postgres:16-alpine
    container_name: ayni-payments-db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ayni
      PGPASSWORD: ayni
      PGDATABASE: ayni
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'ayni_payments'" | grep -q 1
        || psql -c "CREATE DATABASE ayni_payments"
    restart: "no"

  # Credit purchases and the payment provider (ADR 0008, ADR 0011). Built from payments-service/ as
  # a deployment runs it. It publishes no port: only the backend calls it, on this network.
  payments:
    build: ./payments-service
    container_name: ayni-payments
    depends_on:
      payments-db:
        condition: service_completed_successfully
    # The same limits as a deployment (deploy/README.md, "Memory").
    mem_limit: ${AYNI_PAYMENTS_MEMORY_LIMIT:-256m}
    memswap_limit: ${AYNI_PAYMENTS_MEMORY_LIMIT:-256m}
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms32m -Xmx${AYNI_PAYMENTS_HEAP:-96m} -XX:MaxMetaspaceSize=80m -Xss512k -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=16m"
      AYNI_PAYMENTS_DB_URL: jdbc:postgresql://postgres:5432/ayni_payments
      # Two roles, as in the backend (TS01): Flyway migrates as the owner, the service connects as
      # ayni_payments_app, which has no BYPASSRLS. Development values only.
      AYNI_PAYMENTS_DB_USER: ayni
      AYNI_PAYMENTS_DB_PASSWORD: ayni
      AYNI_PAYMENTS_DB_APP_USER: ayni_payments_app
      AYNI_PAYMENTS_DB_APP_PASSWORD: ayni_payments_app
      AYNI_INTERNAL_TOKEN: ${AYNI_INTERNAL_TOKEN:-ayni-development-internal-token-change-me}
      AYNI_PAYMENTS_MONOLITH_URL: http://backend:8080
      AYNI_PAYMENTS_MONTHLY_CREDIT_LIMIT: ${AYNI_PAYMENTS_MONTHLY_CREDIT_LIMIT:-5}
      AYNI_PAYMENTS_PRICE_PER_CREDIT: ${AYNI_PAYMENTS_PRICE_PER_CREDIT:-5.00}
      AYNI_PAYMENTS_PENDING_TIMEOUT: ${AYNI_PAYMENTS_PENDING_TIMEOUT:-PT24H}
      AYNI_PAYMENTS_RECONCILIATION_DELAY: ${AYNI_PAYMENTS_RECONCILIATION_DELAY:-PT1M}
      AYNI_PAYMENTS_SIMULATED_OUTCOME: ${AYNI_PAYMENTS_SIMULATED_OUTCOME:-CONFIRMED}
      AYNI_PAYMENTS_SIMULATED_RESOLUTION_OUTCOME: ${AYNI_PAYMENTS_SIMULATED_RESOLUTION_OUTCOME:-CONFIRMED}
      AYNI_PAYMENTS_FAILURE_THRESHOLD: ${AYNI_PAYMENTS_FAILURE_THRESHOLD:-3}
      AYNI_PAYMENTS_CIRCUIT_OPEN_DURATION: ${AYNI_PAYMENTS_CIRCUIT_OPEN_DURATION:-PT30S}
      AYNI_PAYMENTS_TIMEOUT: ${AYNI_PAYMENTS_TIMEOUT:-PT2S}
      AYNI_PAYMENTS_MAX_CONCURRENT_CALLS: ${AYNI_PAYMENTS_MAX_CONCURRENT_CALLS:-2}
      # demo turns on the switch of the simulated provider (docs/demo.md), as it does in the
      # backend: SPRING_PROFILES_ACTIVE=demo docker compose up starts both with it.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build: ./web
    container_name: ayni-web
    depends_on:
      - backend
    environment:
      # Where Vite's proxy sends /api: the backend by its name on the compose network.
      AYNI_API_URL: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      # node_modules stays inside the container: the host may run a different
      # operating system, and native packages are not interchangeable.
      - ./web:/app
      - /app/node_modules

  # ---------------------------------------------------------------------------
  # The video call of the sessions (US08): a self hosted Jitsi that only lets in
  # whoever holds a token the backend signed for that room. Four containers and a
  # few hundred megabytes, so it is not part of the normal start. Start it with:
  #
  #     docker compose --profile video up
  #
  # and open the room at http://localhost:8000/<room>?jwt=<token>, both of which
  # POST /api/v1/sessions/{id}/join answers.
  # ---------------------------------------------------------------------------

  jitsi-web:
    image: jitsi/web:stable-9584
    profiles: [video]
    container_name: ayni-jitsi-web
    ports:
      - "8000:80"
    environment: &jitsi
      ENABLE_AUTH: "1"
      AUTH_TYPE: jwt
      ENABLE_GUESTS: "0"
      JWT_APP_ID: ayni
      JWT_APP_SECRET: ${AYNI_JITSI_JWT_SECRET:-ayni-development-jitsi-secret-change-me}
      JWT_ACCEPTED_ISSUERS: ayni
      JWT_ACCEPTED_AUDIENCES: jitsi
      # The address of the call as the browsers reach it, and the address the video bridge offers
      # them for the media (UDP 10000). Both stay on this machine unless set (docs/demo.md).
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-http://localhost:8000}
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      JICOFO_AUTH_PASSWORD: ayni-development-jicofo
      JVB_AUTH_PASSWORD: ayni-development-jvb
      JVB_ADVERTISE_IPS: ${JITSI_ADVERTISE_IP:-127.0.0.1}
      # The call runs on plain http here. Jitsi builds the address of its signalling as
      # https://<PUBLIC_URL>/http-bind, which with an http PUBLIC_URL is https://http://... and never
      # connects: the call kept "reconnecting". A relative /http-bind on the page's own origin, and
      # no XMPP websocket (it would be wss://), is what works on http. A deployment uses HTTPS and
      # its own compose (deploy/jitsi).
      BOSH_RELATIVE: "1"
      ENABLE_XMPP_WEBSOCKET: "0"
      TZ: UTC
    networks:
      - jitsi
    depends_on:
      - jitsi-prosody

  jitsi-prosody:
    image: jitsi/prosody:stable-9584
    profiles: [video]
    container_name: ayni-jitsi-prosody
    expose:
      - "5222"
      - "5280"
      - "5347"
    environment: *jitsi
    networks:
      jitsi:
        aliases:
          - xmpp.meet.jitsi

  jitsi-jicofo:
    image: jitsi/jicofo:stable-9584
    profiles: [video]
    container_name: ayni-jitsi-jicofo
    environment: *jitsi
    networks:
      - jitsi
    depends_on:
      - jitsi-prosody

  jitsi-jvb:
    image: jitsi/jvb:stable-9584
    profiles: [video]
    container_name: ayni-jitsi-jvb
    ports:
      - "10000:10000/udp"
    environment: *jitsi
    networks:
      - jitsi
    depends_on:
      - jitsi-prosody

networks:
  jitsi:
    name: ayni-jitsi

volumes:
  postgres-data:
    name: ayni-postgres-data
  maven-cache:
    name: ayni-maven-cache
  skills-evidence:
    name: ayni-skills-evidence
