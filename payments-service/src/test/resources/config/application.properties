# Test-only overrides, loaded on top of src/main/resources/application.yml.

# The reconciliation and the outbox relay run on a schedule in the service. In the tests they would
# run in the background of every cached context and race the test for the same rows; tests call
# them themselves when they mean to, so the schedules are pushed out of reach.
ayni.payments.reconciliation-delay=PT24H
ayni.payments.outbox.relay-delay=PT24H

# TS01: Flyway migrates as the owner, the container's own user, while the service connects as
# ayni_payments_app (see ApplicationRoleTestConnection), so row level security applies to every
# query the service makes in the tests too.
spring.flyway.user=test
spring.flyway.password=test

# The secret every call of the tests carries in X-Internal-Token.
ayni.internal-token=test-internal-token

# Eager in the tests, so a context that cannot start fails in the test that builds it.
spring.main.lazy-initialization=false

# No monolith in these tests: the relay of a test that does not start a fake one of its own fails
# fast against a port nothing listens on, never against a backend running on this machine.
ayni.payments.monolith-url=http://127.0.0.1:9
