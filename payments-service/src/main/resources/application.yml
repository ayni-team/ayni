# The payments service (ADR 0011). Every value of ADR 0008 is the one the monolith had, under the
# same AYNI_PAYMENTS_* variables, so moving them from the backend container to this one changes
# nothing about how purchases behave.

spring:
  application:
    name: ayni-payments

  # Small on purpose: it shares a machine of 1 GB with the backend (deploy/README.md, "Memory").
  # Lazy initialization leaves out of the start what is only needed by a request, which the first
  # request then pays for; the jobs and the database are kept eager below and in the code
  # (@Lazy(false)), so a start that cannot reach the database still fails at once.
  main:
    lazy-initialization: ${AYNI_PAYMENTS_LAZY_INITIALIZATION:true}
    banner-mode: off

  datasource:
    # Its own database on the same PostgreSQL server as the monolith's: base distinta, Database per
    # Service. localhost from an IDE; docker compose sets the address of the postgres service.
    url: ${AYNI_PAYMENTS_DB_URL:jdbc:postgresql://localhost:5432/ayni_payments}
    # The service's own role, without BYPASSRLS, so the policies apply (TS01). Flyway creates it on
    # the migration that needs it, with the name and password below, unless it exists already.
    username: ${AYNI_PAYMENTS_DB_APP_USER:ayni_payments_app}
    password: ${AYNI_PAYMENTS_DB_APP_PASSWORD:ayni_payments_app}
    hikari:
      # Three connections: a request, the reconciliation job and the outbox relay at once. Nothing
      # holds one while it waits for the provider or the monolith.
      maximum-pool-size: ${AYNI_PAYMENTS_DB_POOL_SIZE:3}
      minimum-idle: 1
      connection-timeout: 10000
      pool-name: payments

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations run as the owner of ayni_payments, which the policies do not restrict.
    user: ${AYNI_PAYMENTS_DB_USER:ayni}
    password: ${AYNI_PAYMENTS_DB_PASSWORD:ayni}
    placeholders:
      app_user: ${AYNI_PAYMENTS_DB_APP_USER:ayni_payments_app}
      app_password: ${AYNI_PAYMENTS_DB_APP_PASSWORD:ayni_payments_app}

  task:
    scheduling:
      # The reconciliation job and the outbox relay: neither waits for the other.
      pool:
        size: 2

server:
  port: ${AYNI_PAYMENTS_PORT:8081}
  error:
    include-message: always
  tomcat:
    # Only the monolith calls it, and the monolith lets through at most AYNI_PAYMENTS_SERVICE_MAX_CONCURRENT_CALLS
    # at once. Each thread costs memory of its own; Tomcat's default is 200.
    threads:
      max: ${AYNI_PAYMENTS_TOMCAT_THREADS_MAX:20}
      min-spare: 2
    accept-count: 20

logging:
  level:
    pe.ayni: INFO

ayni:
  # The secret the monolith and this service share. Every call must carry it in X-Internal-Token, and
  # the relay sends it to the monolith. Development value only: a deployment sets its own.
  internal-token: ${AYNI_INTERNAL_TOKEN:ayni-development-internal-token-change-me}
  payments:
    # The first product rule uses a UTC calendar month until universities expose academic cycles.
    monthly-credit-limit: ${AYNI_PAYMENTS_MONTHLY_CREDIT_LIMIT:5}
    price-per-credit: ${AYNI_PAYMENTS_PRICE_PER_CREDIT:5.00}
    pending-timeout: ${AYNI_PAYMENTS_PENDING_TIMEOUT:PT24H}
    reconciliation-delay: ${AYNI_PAYMENTS_RECONCILIATION_DELAY:PT1M}
    # CONFIRMED, REJECTED, PENDING, or UNAVAILABLE for a simulated initial charge.
    simulated-outcome: ${AYNI_PAYMENTS_SIMULATED_OUTCOME:CONFIRMED}
    # CONFIRMED, REJECTED, PENDING, or UNAVAILABLE when reconciling an unresolved payment.
    simulated-resolution-outcome: ${AYNI_PAYMENTS_SIMULATED_RESOLUTION_OUTCOME:CONFIRMED}
    resilience:
      failure-threshold: ${AYNI_PAYMENTS_FAILURE_THRESHOLD:3}
      open-duration: ${AYNI_PAYMENTS_CIRCUIT_OPEN_DURATION:PT30S}
      timeout: ${AYNI_PAYMENTS_TIMEOUT:PT2S}
      max-concurrent-calls: ${AYNI_PAYMENTS_MAX_CONCURRENT_CALLS:2}
    # Where the facts of the outbox go: the monolith, by its name on the private network.
    monolith-url: ${AYNI_PAYMENTS_MONOLITH_URL:http://localhost:8080}
    outbox:
      relay-delay: ${AYNI_PAYMENTS_OUTBOX_RELAY_DELAY:PT2S}
      timeout: ${AYNI_PAYMENTS_OUTBOX_TIMEOUT:PT5S}
      backoff-initial: ${AYNI_PAYMENTS_OUTBOX_BACKOFF_INITIAL:PT2S}
      backoff-max: ${AYNI_PAYMENTS_OUTBOX_BACKOFF_MAX:PT5M}
      batch-size: 20
