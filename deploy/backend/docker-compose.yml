# =============================================================================
# The stack of the backend machine (deploy/README.md, "The two machines").
#
#   backend  the production image (backend/Dockerfile.prod), profile prod
#   proxy    Caddy: the TLS certificate of the api. hostname
#   mailpit  optional, only with --profile mailpit (see "Mail" in deploy/README.md)
#
# PostgreSQL is not here: it is the managed server the DB variables point to. Jitsi is not here
# either: it runs on a machine of its own (deploy/jitsi), and the backend never calls it, it only
# signs the passes browsers take there. Nor is the web application: Azure Static Web Apps serves it
# at app.<domain>, and the deploy workflow publishes it.
#
# Everything is configured from deploy/backend/.env (copy .env.example). Run it from this folder:
#
#     docker compose pull && docker compose up -d --wait
#
# Never `docker compose down -v`: it erases the volumes below (deploy/README.md, "What not to do").
# =============================================================================

name: ayni

# Docker keeps every line a container prints, with no limit, and a machine that stays on for weeks
# fills its disk with them. Each service keeps at most three files of 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:

  backend:
    image: ${AYNI_IMAGE_REPOSITORY:?Set AYNI_IMAGE_REPOSITORY in deploy/backend/.env}:${AYNI_IMAGE_TAG:?Set AYNI_IMAGE_TAG in deploy/backend/.env}
    restart: unless-stopped
    logging: *logging
    # The JVM below was measured inside this limit (deploy/README.md, "Memory"). Swap is off for the
    # container: past the limit it is killed and restarted instead of slowing everything down.
    mem_limit: ${AYNI_BACKEND_MEMORY_LIMIT:-650m}
    memswap_limit: ${AYNI_BACKEND_MEMORY_LIMIT:-650m}
    environment:
      # Under prod the application refuses to start, naming it, when a required variable is
      # missing. The ones below with ":?" fail here first, before any container is touched.
      SPRING_PROFILES_ACTIVE: prod
      # Sized for a machine of 1 GB (deploy/README.md, "Memory"). A percentage of the container
      # would let the heap grow until the memory outside it no longer fits, and the kernel kills
      # the process.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:+UseSerialGC -Xms128m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:TieredStopAtLevel=1}
      # Each request thread costs memory of its own; Tomcat's default is 200.
      SERVER_TOMCAT_THREADS_MAX: ${AYNI_TOMCAT_THREADS_MAX:-50}
      AYNI_PORT: ${AYNI_PORT:-8080}

      AYNI_DB_URL: ${AYNI_DB_URL:?Set AYNI_DB_URL in deploy/backend/.env}
      AYNI_DB_USER: ${AYNI_DB_USER:?Set AYNI_DB_USER in deploy/backend/.env}
      AYNI_DB_PASSWORD: ${AYNI_DB_PASSWORD:?Set AYNI_DB_PASSWORD in deploy/backend/.env}
      AYNI_DB_APP_USER: ${AYNI_DB_APP_USER:?Set AYNI_DB_APP_USER in deploy/backend/.env}
      AYNI_DB_APP_PASSWORD: ${AYNI_DB_APP_PASSWORD:?Set AYNI_DB_APP_PASSWORD in deploy/backend/.env}
      AYNI_DB_POOL_SIZE: ${AYNI_DB_POOL_SIZE:-10}

      AYNI_JITSI_JWT_SECRET: ${AYNI_JITSI_JWT_SECRET:?Set AYNI_JITSI_JWT_SECRET in deploy/backend/.env}
      AYNI_JITSI_URL: ${AYNI_JITSI_URL:?Set AYNI_JITSI_URL in deploy/backend/.env}
      AYNI_JITSI_APP_ID: ${AYNI_JITSI_APP_ID:-ayni}

      AYNI_IDENTITY_ACCESS_LINK_BASE_URL: ${AYNI_IDENTITY_ACCESS_LINK_BASE_URL:?Set AYNI_IDENTITY_ACCESS_LINK_BASE_URL in deploy/backend/.env}
      AYNI_ALLOWED_ORIGINS: ${AYNI_ALLOWED_ORIGINS:?Set AYNI_ALLOWED_ORIGINS in deploy/backend/.env}
      AYNI_BOOTSTRAP_ADMIN_EMAIL: ${AYNI_BOOTSTRAP_ADMIN_EMAIL:-}
      AYNI_BOOTSTRAP_ADMIN_FULL_NAME: ${AYNI_BOOTSTRAP_ADMIN_FULL_NAME:-Ayni Platform Administrator}
      AYNI_API_DOCS_ENABLED: ${AYNI_API_DOCS_ENABLED:-false}

      AYNI_MAIL_HOST: ${AYNI_MAIL_HOST:?Set AYNI_MAIL_HOST in deploy/backend/.env}
      AYNI_MAIL_PORT: ${AYNI_MAIL_PORT:?Set AYNI_MAIL_PORT in deploy/backend/.env}
      AYNI_MAIL_USER: ${AYNI_MAIL_USER:-}
      AYNI_MAIL_PASSWORD: ${AYNI_MAIL_PASSWORD:-}
      AYNI_MAIL_FROM: ${AYNI_MAIL_FROM:-Ayni <no-reply@ayni.local>}
      # Spring's own names for two JavaMail switches a real SMTP server usually needs: port 587
      # asks for STARTTLS, port 465 for TLS from the first byte. Off by default, as in the
      # application, which is what Mailpit expects.
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${AYNI_MAIL_STARTTLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${AYNI_MAIL_SSL:-false}
      # An optional second server for a short list of addresses, the rest still leaving through
      # the one above (deploy/README.md, "Mail"). Empty means no real relay; one of the host and
      # the list without the other stops the startup.
      AYNI_REAL_RELAY_ALLOWED_RECIPIENTS: ${AYNI_REAL_RELAY_ALLOWED_RECIPIENTS:-}
      AYNI_REAL_RELAY_HOST: ${AYNI_REAL_RELAY_HOST:-}
      AYNI_REAL_RELAY_PORT: ${AYNI_REAL_RELAY_PORT:-}
      AYNI_REAL_RELAY_USERNAME: ${AYNI_REAL_RELAY_USERNAME:-}
      AYNI_REAL_RELAY_PASSWORD: ${AYNI_REAL_RELAY_PASSWORD:-}
      AYNI_REAL_RELAY_STARTTLS: ${AYNI_REAL_RELAY_STARTTLS:-}
      AYNI_REAL_RELAY_SSL: ${AYNI_REAL_RELAY_SSL:-}

      AYNI_ACADEMIC_DIRECTORY: ${AYNI_ACADEMIC_DIRECTORY:-/var/lib/ayni/academic-directory}
      # Set, the documents of the academic system come from this address of another service (a
      # GitHub Pages site) instead of the folder above, which keeps only the local students.
      AYNI_ACADEMIC_DIRECTORY_URL: ${AYNI_ACADEMIC_DIRECTORY_URL:-}
      AYNI_SKILLS_EVIDENCE_DIR: ${AYNI_SKILLS_EVIDENCE_DIR:-/var/lib/ayni/evidence}

      AYNI_PAYMENTS_MONTHLY_CREDIT_LIMIT: ${AYNI_PAYMENTS_MONTHLY_CREDIT_LIMIT:-5}
      AYNI_PAYMENTS_PRICE_PER_CREDIT: ${AYNI_PAYMENTS_PRICE_PER_CREDIT:-5.00}
      AYNI_PAYMENTS_PENDING_TIMEOUT: ${AYNI_PAYMENTS_PENDING_TIMEOUT:-PT24H}
      AYNI_PAYMENTS_RECONCILIATION_DELAY: ${AYNI_PAYMENTS_RECONCILIATION_DELAY:-PT1M}
      AYNI_PAYMENTS_SIMULATED_OUTCOME: ${AYNI_PAYMENTS_SIMULATED_OUTCOME:-CONFIRMED}
      AYNI_PAYMENTS_SIMULATED_RESOLUTION_OUTCOME: ${AYNI_PAYMENTS_SIMULATED_RESOLUTION_OUTCOME:-CONFIRMED}
      AYNI_PAYMENTS_FAILURE_THRESHOLD: ${AYNI_PAYMENTS_FAILURE_THRESHOLD:-3}
      AYNI_PAYMENTS_CIRCUIT_OPEN_DURATION: ${AYNI_PAYMENTS_CIRCUIT_OPEN_DURATION:-PT30S}
      AYNI_PAYMENTS_TIMEOUT: ${AYNI_PAYMENTS_TIMEOUT:-PT2S}
      AYNI_PAYMENTS_MAX_CONCURRENT_CALLS: ${AYNI_PAYMENTS_MAX_CONCURRENT_CALLS:-2}
    volumes:
      # The evidence files (US16) and the simulated academic system (ADR 0006). Named volumes keep
      # them when the container is replaced by an update. They start with the ownership of the
      # image's folders, which belong to the unprivileged user of the image.
      - evidence:${AYNI_SKILLS_EVIDENCE_DIR:-/var/lib/ayni/evidence}
      - academic-directory:${AYNI_ACADEMIC_DIRECTORY:-/var/lib/ayni/academic-directory}
    healthcheck:
      # Readiness (the database answers). The probe speaks HTTP by hand through bash, so the image
      # does not need curl. The first start runs every migration, hence the long start period.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/$${AYNI_PORT:-8080} && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    # A stop lets the requests in flight finish (server.shutdown: graceful).
    stop_grace_period: 40s
    networks: [edge]

  # ---------------------------------------------------------------------------
  # The proxy: the only service that publishes web ports. Caddy asks a certificate authority for a
  # certificate for each hostname the first time it needs one, which needs the DNS records to
  # point at this machine and ports 80 and 443 to be open.
  # ---------------------------------------------------------------------------
  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      AYNI_DOMAIN: ${AYNI_DOMAIN:?Set AYNI_DOMAIN in deploy/backend/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/backend/.env}
      AYNI_PORT: ${AYNI_PORT:-8080}
      # The address of the Mailpit page. While the mailpit profile is off it stays an address that
      # no certificate is asked for and nothing outside the container can reach. The hash is that
      # of a random password nobody knows, so a forgotten value locks the page instead of opening it.
      MAILPIT_SITE: ${MAILPIT_SITE:-http://mailpit.internal:8081}
      MAILPIT_BASIC_AUTH_USER: ${MAILPIT_BASIC_AUTH_USER:-ayni}
      MAILPIT_PASSWORD_HASH: ${MAILPIT_PASSWORD_HASH:-$$2a$$14$$JxrZe/D8eza7Y5aznxiU5.qzDJI0V4WsrZy8EOVgeB1sMlfH319yO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and Caddy's account. Losing them means asking for every certificate again,
      # and certificate authorities limit how often that can be done.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    networks: [edge]

  # ---------------------------------------------------------------------------
  # Optional: catches every email instead of delivering it, and shows them at
  # https://<MAILPIT_SITE> behind a user and a password the proxy asks for. For a demonstration
  # only: the emails hold the links that sign people in. Read "Mail" in deploy/README.md first.
  #
  #     docker compose --profile mailpit up -d
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mailpit]
    restart: unless-stopped
    logging: *logging
    networks: [edge]

networks:
  # The proxy, the backend and whatever the proxy forwards to.
  edge:
    name: ayni-edge

volumes:
  evidence:
    name: ayni-prod-evidence
  academic-directory:
    name: ayni-prod-academic-directory
  caddy-data:
    name: ayni-prod-caddy-data
  caddy-config:
    name: ayni-prod-caddy-config
